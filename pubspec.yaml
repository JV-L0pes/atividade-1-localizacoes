name: localizacoes
description: Coleta e visualização de localizações em Flutter para Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  # 13.x exige compileSdk 37, que o AGP resolve como android-37 inexistente.
  permission_handler: ^12.0.3
  sqflite: ^2.4.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
